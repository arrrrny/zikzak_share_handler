name: zikzak_share_handler_macos
description: An implementation for the macOS platform of the Flutter zikzak_share_handler plugin.
repository: https://github.com/arrrrny/zikzak_share_handler/tree/main/zikzak_share_handler_macos
version: 0.0.33

environment:
  sdk: ">=2.14.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter
  zikzak_share_handler_platform_interface:
    path: ../zikzak_share_handler_platform_interface

dev_dependencies:
  flutter_lints:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: zikzak_share_handler
    platforms:
      macos:
        pluginClass: ShareHandlerMacosPlatform
        dartPluginClass: ShareHandlerMacosPlatform
